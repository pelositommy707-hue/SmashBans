<!DOCTYPE html>
<html>
    <head>
        <style>
            p.Header {
                color: white;
            }
            
            body {
                background-color: #0a0a0f;
            }
            
            .image-row {
                display: flex;
                flex-wrap: wrap;
                width: fit-content;
                max-width: 1120px;
                gap: 0px 0px;
                padding-left: 15px;
                padding-right: 15px;
                margin-top: 30px;
                margin-left: 20px;
                margin-right: 20px;
                border-radius: 20px;
                background-color: #2a2a40;
            }

            .image-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 30px;
                margin-bottom: 30px;
                margin-left: 15px;
                margin-right: 15px;
                border-radius: 20px;
                color: #ababd3;
                background-color: #1a1a26;
                font-size: 20px;
            }
        
            .image-item img {
                width: 250px;
                display: block;
                border-radius: 20px 20px 0px 0px;
                margin-bottom: -12px;
            }

            .image-item p {
                margin-bottom: 8px;
            }

            .image-wrapper {
                position: relative;
                cursor: pointer;
            }

            .x-overlay {
                display: none;
                position: absolute;
                top: 0px;
                left: 10px;
                width: 90%;
                margin-top: -100;
                justify-content: center;
                align-items: center;
                pointer-events: none;
            }

            .x-overlay.active {
                display: flex;
            }

            .x-overlay img {
                width: 60%;
                margin-bottom: 0;
            }

            /* Popup modal styles */
            .popup-modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.75);
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .popup-modal.active {
                display: flex;
            }

            .popup-content {
                background-color: #1a1a26;
                border-radius: 20px;
                padding: 20px 30px 25px 30px;
                text-align: center;
                color: #ababd3;
                font-size: 22px;
                position: relative;
            }

            .popup-content img {
                width: 350px;
                border-radius: 15px;
                display: block;
                margin: 10px 0;
            }

            .popup-close {
                position: absolute;
                top: 8px;
                right: 14px;
                cursor: pointer;
                color: #ababd3;
                font-size: 24px;
                font-weight: bold;
                line-height: 1;
            }

            .popup-close:hover {
                color: white;
            }
        </style>
    </head>

    <body>
        <script>
            function toggleX(wrapper) {
                const overlay = wrapper.querySelector(".x-overlay");
                const activeCount = document.querySelectorAll(".x-overlay.active").length;

                // If this item isn't already X'd, and 3 are already X'd,
                // open the popup instead of adding a 4th X.
                if (!overlay.classList.contains("active") && activeCount >= 3) {
                    showPopup(wrapper);
                    return;
                }

                overlay.classList.toggle("active");
            }

            function showPopup(wrapper) {
                const imgSrc = wrapper.querySelector("img").src;
                const caption = wrapper.parentElement.querySelector("p").textContent.trim();

                document.getElementById("popup-img").src = imgSrc;
                document.getElementById("popup-caption").textContent = caption;
                document.getElementById("popup-modal").classList.add("active");
            }

            function closePopup() {
                document.getElementById("popup-modal").classList.remove("active");
            }
        </script>

        <p class="Header">
            Winner's Bans:
        </p>
        
        <div class="image-row">
            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Battlefield.jpg" alt="Battlefield">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Battlefield
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Small_Battlefield.jpg" alt="Small Battlefield">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Small Battlefield
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/PS2.jpg" alt="PS2">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    PS2
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Smashville.jpg" alt="Smashville">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Smashville
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Town_And_City.jpg" alt="Town and City">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Town and City
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Final_Destination.jpg" alt="Final Destination">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Final Destination
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Hollow_Bastion.jpg" alt="Hollow Bastion">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Hollow Bastion
                </p>
            </div>

            <div class="image-item">
                <div class="image-wrapper" onclick="toggleX(this)">
                    <img src="StageImages/Kalos.jpg" alt="Kalos">
                    <div class="x-overlay">
                        <img src="Red_X.jpg">
                    </div>
                </div>
                <p>
                    Kalos
                </p>
            </div>
        </div>

        <!-- Popup modal -->
        <div class="popup-modal" id="popup-modal" onclick="if(event.target === this) closePopup()">
            <div class="popup-content">
                <span class="popup-close" onclick="closePopup()">&times;</span>
                <p id="popup-caption"></p>
                <img id="popup-img" src="" alt="Selected stage">
            </div>
        </div>
    </body>
</html>
